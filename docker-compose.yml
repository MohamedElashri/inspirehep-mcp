services:
  inspirehep-mcp:
    image: "${INSPIREHEP_IMAGE:-ghcr.io/mohamedelashri/inspirehep-mcp:latest}"
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      INSPIREHEP_ALLOWED_HOSTS: "${INSPIREHEP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}"
      INSPIREHEP_ALLOWED_ORIGINS: "${INSPIREHEP_ALLOWED_ORIGINS:-}"
      INSPIREHEP_HTTP_RATE_LIMIT: "${INSPIREHEP_HTTP_RATE_LIMIT:-60}"
      INSPIREHEP_HTTP_RATE_LIMIT_BURST: "${INSPIREHEP_HTTP_RATE_LIMIT_BURST:-20}"
      INSPIREHEP_HTTP_RATE_LIMIT_MAX_CLIENTS: "${INSPIREHEP_HTTP_RATE_LIMIT_MAX_CLIENTS:-10000}"
      INSPIREHEP_HTTP_MAX_BODY_SIZE: "${INSPIREHEP_HTTP_MAX_BODY_SIZE:-262144}"
      INSPIREHEP_HTTP_MAX_CONCURRENCY: "${INSPIREHEP_HTTP_MAX_CONCURRENCY:-100}"
      INSPIREHEP_HTTP_KEEP_ALIVE_TIMEOUT: "${INSPIREHEP_HTTP_KEEP_ALIVE_TIMEOUT:-5}"
      INSPIREHEP_UPSTREAM_MAX_PENDING: "${INSPIREHEP_UPSTREAM_MAX_PENDING:-32}"
      INSPIREHEP_MAX_INPUT_LENGTH: "${INSPIREHEP_MAX_INPUT_LENGTH:-2048}"
      INSPIREHEP_MAX_IDENTIFIER_LENGTH: "${INSPIREHEP_MAX_IDENTIFIER_LENGTH:-512}"
      INSPIREHEP_MAX_RESPONSE_BYTES: "${INSPIREHEP_MAX_RESPONSE_BYTES:-1048576}"
      INSPIREHEP_MAX_REFERENCES: "${INSPIREHEP_MAX_REFERENCES:-250}"
      INSPIREHEP_MAX_FIGURES: "${INSPIREHEP_MAX_FIGURES:-100}"
      INSPIREHEP_TRUST_PROXY_HEADERS: "${INSPIREHEP_TRUST_PROXY_HEADERS:-false}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
