[project]
name = "inspirehep-mcp"
version = "0.4.0"
description = "MCP server for InspireHEP - integrate high-energy physics literature resources with LLMs"
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [{ name = "MohamedElashri", email = "mail@elashri.com" }]
keywords = ["mcp", "inspirehep", "hep", "physics", "citations", "arxiv", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx2>=2.16.0,<3",
    "pydantic>=2.14.2,<3",
    "anyio>=4.15.1,<5",
    "uvicorn>=0.54.0,<1",
    "starlette>=1.10.0,<2",
]

[project.urls]
Homepage = "https://github.com/MohamedElashri/inspirehep-mcp"
Repository = "https://github.com/MohamedElashri/inspirehep-mcp"
Issues = "https://github.com/MohamedElashri/inspirehep-mcp/issues"

[project.scripts]
inspirehep-mcp = "inspirehep_mcp.server:main"

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.coverage", "/.uv-cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "pytest-asyncio>=1.4.1,<2", "pytest-cov>=7.1.0,<8"]
publish = ["pypi-attestations>=0.0.30,<0.1"]
